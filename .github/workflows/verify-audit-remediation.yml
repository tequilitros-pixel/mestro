name: Verificar correcciones de auditoría
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma types
        run: pnpm exec prisma generate
      - name: Check TypeScript
        run: pnpm exec tsc --noEmit
      - name: Regression tests
        run: |
          node --import tsx --test \
            tests/offlineQueueRecovery.test.ts \
            tests/offlineSyncPolicy.test.ts \
            tests/offlineSync.test.ts \
            tests/inventoryCountAudit.test.ts \
            tests/inventoryCountRecapture.test.ts
