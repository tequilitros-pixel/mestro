<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Maestro - Sin conexión</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #121415;
      color: #e2e8f0;
      margin: 0;
      padding: 24px;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: #1c1f22;
      border: 1px solid #2e353b;
      border-radius: 16px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #f8fafc;
      margin: 0 0 12px;
    }
    p {
      font-size: 14px;
      line-height: 1.6;
      color: #94a3b8;
      margin: 0 0 24px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: 600;
      color: #121415;
      background: #e28735;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .btn:active {
      opacity: 0.8;
    }
    .status-hint {
      margin-top: 16px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">📡</div>
    <h1>Sin conexión a internet</h1>
    <p>Maestro requiere conexión a la red para sincronizar operaciones, asistencia y ventas de forma segura. Revisa tu conexión Wi-Fi o datos móviles.</p>
    <button class="btn" onclick="window.location.href='https://maestro-destiladora.space'">Reintentar conexión</button>
    <div class="status-hint">Destiladora del Norte · Sistema Operativo</div>
  </main>
</body>
</html>
